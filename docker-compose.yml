x-app: &app
  build: .
  environment:
    APP_DATABASE_URL: postgresql://app:app@postgres:5432/app
    APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-dbmate: &dbmate
  image: ghcr.io/amacneil/dbmate:2
  environment:
    DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
  volumes:
    - ./db:/db
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30

  migrate-visits:
    <<: *dbmate
    command: --wait --no-dump-schema -d /db/visits/migrations --migrations-table visits.schema_migrations up

  migrate-billing:
    <<: *dbmate
    command: --wait --no-dump-schema -d /db/billing/migrations --migrations-table billing.schema_migrations up

  seed:
    image: postgres:16-alpine
    command: psql postgresql://app:app@postgres:5432/app -v ON_ERROR_STOP=1 -f /seed/seed.sql
    volumes:
      - ./db/seed.sql:/seed/seed.sql:ro
    depends_on:
      migrate-visits:
        condition: service_completed_successfully
      migrate-billing:
        condition: service_completed_successfully

  api:
    <<: *app
    command: uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate-visits:
        condition: service_completed_successfully
      migrate-billing:
        condition: service_completed_successfully

  outbox-relay:
    <<: *app
    command: python -m app.visits.relay
    restart: unless-stopped
    depends_on:
      migrate-visits:
        condition: service_completed_successfully

  billing-consumer:
    <<: *app
    command: faststream run --factory app.billing.consumer:create_app
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      migrate-billing:
        condition: service_completed_successfully

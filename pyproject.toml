[project]
name = "billing-for-visits"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "asyncpg>=0.32",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "faststream[kafka]>=0.7.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "testcontainers[postgres,kafka]>=4.15",
    "import-linter>=2.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Visits and Billing are independent"
type = "independence"
modules = ["app.visits", "app.billing"]
